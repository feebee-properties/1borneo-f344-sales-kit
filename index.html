<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aforce ONE Strategic Evaluation - Unit F-344</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { background-color: #0A192F; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Icons as Components (SVG)
        const TrendingUp = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-cyan-400 w-5 h-5"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>;
        const Lock = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-3 h-3 text-white opacity-75"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>;
        const CheckCircle = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className || "w-4 h-4 text-white"}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>;
        const ShieldAlert = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className || "w-3 h-3"}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>;
        const Ban = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-red-500 w-5 h-5"><circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg>;

        const StrategicInfographic = () => {
            return (
                <div className="min-h-screen bg-[#0A192F] sm:bg-gray-900 flex justify-center sm:py-8 font-sans">
                
                {/* Card Container */}
                <div className="w-full max-w-md bg-[#0A192F] sm:shadow-2xl overflow-hidden sm:rounded-2xl sm:border border-gray-700 relative flex flex-col">
                    
                    {/* HEADER */}
                    <div className="bg-gradient-to-r from-[#0F2942] to-[#0A192F] p-5 sm:p-6 border-b border-gray-600">
                    <div className="flex items-center justify-between mb-2">
                        <h2 className="text-[#D4AF37] font-bold tracking-widest text-[10px] sm:text-xs uppercase">Aforce ONE Strategic Evaluation</h2>
                        <div className="h-1 w-8 bg-[#D4AF37]"></div>
                    </div>
                    <h1 className="text-2xl sm:text-3xl font-extrabold text-white leading-tight">
                        The Safe Exit <br />
                        <span className="text-cyan-400">Strategy</span>
                    </h1>
                    <p className="text-gray-400 text-xs sm:text-sm mt-2 font-medium">Unit F-344 • 1Borneo Retail</p>
                    </div>

                    {/* SECTION 1: THE REALITY GAP (CHART) */}
                    <div className="p-4 sm:p-6 bg-[#0B1E3B]">
                    <div className="flex items-center gap-2 mb-4">
                        <TrendingUp />
                        <h3 className="text-white font-bold text-lg uppercase tracking-wider">The Price Gap</h3>
                    </div>
                    
                    <div className="space-y-4">
                        {/* Bar 1: Hope Price */}
                        <div className="relative">
                        <div className="flex justify-between text-xs text-red-300 mb-1 font-bold">
                            <span>CLIENT'S HOPE</span>
                            <span>RM 980,000</span>
                        </div>
                        <div className="h-8 bg-gray-800 rounded-sm overflow-hidden relative">
                            <div className="absolute top-0 left-0 h-full bg-red-500 w-[98%] flex items-center justify-end pr-2">
                            <span className="text-[10px] text-white font-bold">Risk: High</span>
                            </div>
                        </div>
                        </div>

                        {/* Bar 2: Bank Value */}
                        <div className="relative opacity-80">
                        <div className="flex justify-between text-xs text-blue-300 mb-1 font-bold">
                            <span>BANK MAX VALUE (2026)</span>
                            <span>RM 660,000</span>
                        </div>
                        <div className="h-8 bg-gray-800 rounded-sm overflow-hidden relative">
                            <div className="absolute top-0 left-0 h-full bg-blue-600 w-[66%] flex items-center justify-end pr-2">
                            <Lock />
                            </div>
                        </div>
                        </div>

                        {/* Bar 3: Proposed Strategy */}
                        <div className="relative transform scale-105 origin-left">
                        <div className="flex justify-between text-xs text-cyan-300 mb-1 font-bold">
                            <span>SWEET SPOT (TARGET)</span>
                            <span>RM 600,000</span>
                        </div>
                        <div className="h-10 bg-gray-800 rounded-md overflow-hidden relative border border-cyan-400 shadow-[0_0_15px_rgba(34,211,238,0.3)]">
                            <div className="absolute top-0 left-0 h-full bg-cyan-500 w-[60%] flex items-center justify-end pr-3">
                            <CheckCircle />
                            </div>
                        </div>
                        </div>

                        {/* Bar 4: Lelong */}
                        <div className="relative opacity-90">
                        <div className="flex justify-between text-xs text-gray-400 mb-1 font-bold">
                            <span className="flex items-center gap-1 text-red-400"><ShieldAlert /> COMPETITOR (LELONG)</span>
                            <span>RM 522,000</span>
                        </div>
                        <div className="h-6 bg-gray-800 rounded-sm overflow-hidden relative border border-red-900/50">
                            <div className="absolute top-0 left-0 h-full bg-gray-600 w-[52%] flex items-center justify-end pr-2">
                                <span className="text-[9px] text-red-200 font-bold tracking-tighter">DANGER ZONE</span>
                            </div>
                        </div>
                        </div>
                    </div>
                    </div>

                    {/* SECTION 2: THE CASH TRAP */}
                    <div className="p-4 sm:p-6 border-t border-gray-700 bg-[#0A192F]">
                    <div className="flex items-center gap-2 mb-4">
                        <Ban />
                        <h3 className="text-white font-bold text-lg uppercase tracking-wider">The Buyer's Barrier</h3>
                    </div>

                    <div className="bg-red-500/10 border border-red-500/30 rounded-lg p-4">
                        <p className="text-gray-300 text-sm mb-2 text-center">If we sell at <span className="text-red-400 font-bold">RM 980k</span>...</p>
                        
                        <div className="flex flex-col gap-2">
                        <div className="flex justify-between text-xs sm:text-sm text-gray-400">
                            <span>Price:</span>
                            <span className="text-white">RM 980,000</span>
                        </div>
                        <div className="flex justify-between text-xs sm:text-sm text-gray-400">
                            <span>Max Loan (90% of 660k):</span>
                            <span className="text-blue-400">- RM 594,000</span>
                        </div>
                        <div className="h-px bg-gray-600 my-1"></div>
                        <div className="flex justify-between text-base sm:text-lg font-bold text-red-400">
                            <span>CASH NEEDED:</span>
                            <span>RM 386,000+</span>
                        </div>
                        </div>
                        
                        <div className="mt-3 text-center bg-red-500 text-white text-[10px] sm:text-xs font-bold py-1 rounded">
                        IMPOSSIBLE FOR 99% OF BUYERS
                        </div>
                    </div>
                    </div>

                    {/* SECTION 3: THE WINNING SOLUTION */}
                    <div className="p-4 sm:p-6 bg-gradient-to-b from-[#0F2942] to-[#0A192F] relative overflow-hidden flex-grow">
                    <div className="absolute top-0 right-0 w-32 h-32 bg-cyan-500/10 rounded-full blur-3xl -mr-10 -mt-10 pointer-events-none"></div>

                    <div className="flex items-center gap-2 mb-4 relative z-10">
                        <CheckCircle className="text-green-400 w-5 h-5" />
                        <h3 className="text-white font-bold text-lg uppercase tracking-wider">The Safe Solution</h3>
                    </div>

                    <div className="bg-cyan-900/20 border border-cyan-500/30 p-4 sm:p-5 rounded-xl relative z-10 backdrop-blur-sm">
                        <h4 className="text-cyan-400 font-bold text-center text-xl mb-4">SELL AT RM 600,000</h4>
                        
                        <ul className="space-y-4 mb-6">
                        <li className="flex items-start gap-3">
                            <div className="bg-cyan-500/20 p-1 rounded-full mt-0.5">
                            <CheckCircle className="w-3 h-3 text-cyan-400" />
                            </div>
                            <span className="text-gray-300 text-xs sm:text-sm"><strong className="text-white">Full Loan Eligibility:</strong> Buyer can borrow 90% (RM 540k). Easy entry.</span>
                        </li>
                        <li className="flex items-start gap-3">
                            <div className="bg-red-500/10 p-1 rounded-full mt-0.5">
                            <ShieldAlert className="w-3 h-3 text-red-400" />
                            </div>
                            <span className="text-gray-300 text-xs sm:text-sm">
                            <strong className="text-white">Beats Lelong Risks (RM 522k):</strong>
                            <br/>
                            <span className="text-[10px] sm:text-xs text-gray-400">Avoid auction nightmares: <span className="text-red-300">No viewing inside</span>, <span className="text-red-300">hidden maintenance debts</span>, and <span className="text-red-300">no warranty</span>.</span>
                            </span>
                        </li>
                        </ul>

                        {/* PROFIT CALC */}
                        <div className="bg-[#0A192F] rounded-lg p-4 border border-gray-700">
                        <p className="text-[10px] sm:text-xs text-gray-400 uppercase tracking-widest text-center mb-2">Your Net Result</p>
                        <div className="flex items-center justify-between mb-1">
                            <span className="text-gray-400 text-xs">Selling Price</span>
                            <span className="text-white text-sm">RM 600,000</span>
                        </div>
                        <div className="flex items-center justify-between mb-2">
                            <span className="text-gray-400 text-xs">Original Cost (2005)</span>
                            <span className="text-gray-400 text-sm">- RM 368,832</span>
                        </div>
                        <div className="h-px bg-gray-600 mb-2"></div>
                        <div className="flex items-center justify-between">
                            <span className="text-[#D4AF37] font-bold text-sm">GROSS PROFIT</span>
                            <span className="text-[#D4AF37] font-bold text-lg sm:text-xl">+ RM 231,168</span>
                        </div>
                        <div className="text-center mt-2">
                            <span className="bg-[#D4AF37] text-black text-[10px] font-bold px-2 py-0.5 rounded-full">62% RETURN ON CAPITAL</span>
                        </div>
                        </div>
                    </div>
                    </div>

                    {/* FOOTER */}
                    <div className="bg-black p-4 text-center border-t border-gray-800">
                    <h3 className="text-[#D4AF37] font-bold tracking-widest text-xs uppercase">AFORCE ONE TEAM</h3>
                    <p className="text-gray-500 text-[10px] mt-1">Empowered Property Solutions • Kota Kinabalu</p>
                    </div>

                </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<StrategicInfographic />);
    </script>
</body>
</html>
